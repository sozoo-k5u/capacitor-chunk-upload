excluded:
  - node_modules
  - dist
  - android
  - example
  - .build
  - .swiftpm

included:
  - ios/Sources
  - ios/Tests

# Disable some overly strict rules for a Capacitor plugin
disabled_rules:
  - force_unwrapping  # Common in Capacitor plugins
  - identifier_name   # Allow single letter variables in loops

# Configure some rules
line_length: 150
file_length: 500
type_body_length: 300
function_body_length: 100
cyclomatic_complexity: 15

# Allow some common patterns in Capacitor plugins
force_cast: warning
force_try: warning
